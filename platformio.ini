; ------------------------------------------------------------------------------
; ESP32-S3-WROOM-1 N16R8 on an ESP32-S3-DevKitC-1 style board
; 16 MB quad-SPI flash + 8 MB octal-SPI PSRAM
;
; The registry board "esp32-s3-devkitc-1" describes the N8 variant (8 MB flash,
; no PSRAM), so the memory settings below override it for the N16R8 module.
; ------------------------------------------------------------------------------

[platformio]
; Default target for the VS Code buttons = the AcoustiScan node firmware.
; Other envs: esp32-s3-n16r8 (Wi-Fi hotspot test), mic-test (USB mic smoke test).
default_envs = node

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; This env builds src/main.cpp (Wi-Fi test) only; the other firmwares have their own envs below.
build_src_filter = +<*> -<mic_test.cpp> -<node/>

; ---- Memory layout for N16R8 -------------------------------------------------
; QIO flash + OPI (octal) PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; ---- Build flags -------------------------------------------------------------
; BOARD_HAS_PSRAM           enable the 8 MB PSRAM
; ARDUINO_USB_MODE=1        native USB pins act as USB-Serial/JTAG (not OTG)
; ARDUINO_USB_CDC_ON_BOOT=1 `Serial`  = native "USB" connector
;                           `Serial0` = "UART" connector (CP2102N bridge)
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---- Serial monitor / upload -------------------------------------------------
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; upload_port / monitor_port are auto-detected. This PC also has Bluetooth COM
; ports (COM3/4/6/7); if auto-detect picks one of those, pin the real port here:
upload_port = COM8
monitor_port = COM8

; ---- PDM microphone smoke test ----------------------------------------------
; Same board/flash/PSRAM/serial settings as above (inherited with `extends`),
; but builds src/mic_test.cpp instead of src/main.cpp:
;   pio run -e mic-test -t upload
; The Wi-Fi firmware stays untouched in the default env.
[env:mic-test]
extends = env:esp32-s3-n16r8
build_src_filter = +<*> -<main.cpp> -<node/>
monitor_speed = 921600

; ---- AcoustiScan node firmware -----------------------------------------------
; Wi-Fi node with one PDM mic: provisioned over USB, discovered over UDP, captures
; on command over TCP. Builds src/node/ only. See PROTOCOL.md.
;   pio run -e node -t upload                      (bench board on COM8)
;   pio run -e node -t upload --upload-port COM9   (another board)
[env:node]
extends = env:esp32-s3-n16r8
platform = espressif32@7.1.3
build_src_filter = +<node/>
